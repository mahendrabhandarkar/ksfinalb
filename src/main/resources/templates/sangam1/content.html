<main id="main-content" class="py-5">
  <div class="container">
    <h1 class="fw-bold mb-4" data-i18n="nav.contact">Contact</h1>
    <div class="row g-4">
      <div class="col-lg-5">
        <div class="card mb-3"><div class="card-body">
          <h2 class="h6 fw-semibold"><i class="bi bi-geo-alt text-primary" aria-hidden="true"></i> Head office</h2>
          <address class="small mb-0">4th Floor, Harmony Tower, FC Road,<br>Shivajinagar, Pune, Maharashtra 411005, India</address>
        </div></div>
        <div class="card mb-3"><div class="card-body">
          <h2 class="h6 fw-semibold"><i class="bi bi-telephone text-primary" aria-hidden="true"></i> Phone</h2>
          <p class="small mb-0"><a href="tel:+911800123456">1800 123 456</a> (toll-free)<br><a href="mailto:help@sangammatrimony.com">help@sangammatrimony.com</a></p>
        </div></div>
        <div class="card"><div class="card-body">
          <h2 class="h6 fw-semibold"><i class="bi bi-clock text-primary" aria-hidden="true"></i> Office hours</h2>
          <p class="small mb-0">Monday – Saturday, 9:00 AM – 9:00 PM IST</p>
        </div></div>
      </div>
      <div class="col-lg-7">
        <form class="card card-body" action="/api/contact" method="post">
          <div class="mb-3">
            <label class="form-label" for="cName" data-i18n="reg.name">Full name</label>
            <input type="text" class="form-control" id="cName" name="name" autocomplete="name" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="cEmail" data-i18n="reg.email">Email address</label>
            <input type="email" class="form-control" id="cEmail" name="email" autocomplete="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="cSubject" data-i18n="contact.subject">Subject</label>
            <select class="form-select" id="cSubject" name="subject" required>
              <option value="">Select…</option>
              <option>General enquiry</option><option>Membership &amp; payments</option>
              <option>Technical issue</option><option>Report a profile</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label" for="cMsg" data-i18n="contact.message">Your message</label>
            <textarea class="form-control" id="cMsg" name="message" rows="5" maxlength="1000" required aria-describedby="msgHint"></textarea>
            <div id="msgHint" class="form-text">Maximum 1000 characters. We reply within 24 hours.</div>
          </div>
          <button type="submit" class="btn btn-primary btn-lg"><i class="bi bi-send" aria-hidden="true"></i> <span data-i18n="contact.send">Send message</span></button>
        </form>
      </div>
    </div>
  </div>
</main>
