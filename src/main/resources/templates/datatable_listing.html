<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>Products</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>

    <!-- DataTables -->
    <link rel="stylesheet"
          th:href="@{/webjars/datatables/css/jquery.dataTables.min.css}"/>

<!--
    <link rel="stylesheet"
          th:href="@{/webjars/datatables-bs5/css/dataTables.bootstrap5.min.css}"/>
-->

    <!-- SweetAlert2 -->
    <link rel="stylesheet"
          th:href="@{/webjars/sweetalert2/dist/sweetalert2.min.css}"/>

    <style>

        body {
            background-color: #f5f5f5;
        }

        .page-wrapper {
            margin-top: 30px;
        }

        .card {
            border-radius: 10px;
        }

        .table th {
            white-space: nowrap;
        }

        .description-column {
            max-width: 300px;
            white-space: normal;
        }

    </style>

</head>

<body>

<div class="container page-wrapper">

    <!-- Controller Assigned Data -->
    <div class="d-flex justify-content-between align-items-center mb-3">

        <div>

            <h2 class="mb-1">
                Product Listing
            </h2>

            <p class="text-muted mb-0">

                Welcome
                <span th:text="${loggedInUser.firstName}">
                    Admin
                </span>

            </p>

        </div>

        <div>

            <span class="badge bg-primary p-2">

                Total Products :
                <span th:text="${totalProducts}">
                    0
                </span>

            </span>

        </div>

    </div>

    <!-- Product Table -->
    <div class="card shadow-sm">

        <div class="card-header bg-dark text-white">

            <h5 class="mb-0">
                Products
            </h5>

        </div>

        <div class="card-body">

            <table id="productsTable"
                   class="table table-bordered table-striped w-100">

                <thead class="table-light">

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Brand</th>

                    <th>Price</th>

                    <th>Inventory</th>

                    <th>Description</th>

                </tr>

                </thead>

            </table>

        </div>

    </div>

</div>

<!-- JQuery -->
<script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>

<!-- Bootstrap -->
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>

<!-- DataTables -->
<script th:src="@{/webjars/datatables/js/jquery.dataTables.min.js}"></script>

<!--
<script th:src="@{/webjars/datatables-bs5/js/dataTables.bootstrap5.min.js}"></script>
-->

<!-- SweetAlert2 -->
<script th:src="@{/webjars/sweetalert2/dist/sweetalert2.all.min.js}"></script>

<script th:inline="javascript">

    $(document).ready(function () {
        const url = /*[[@{/products/datatable}]]*/ '/products/datatable';

        $('#productsTable').DataTable({

            processing: true,

            serverSide: true,

            searching: true,

            ordering: true,

            paging: true,

            pageLength: 2,

            ajax: {

                url: url,

                type: 'POST',

                contentType: 'application/json',

                /*
                 Convert DataTables payload
                 to custom DataTableRequest
                */
                data: function (d) {

                    const request = {

                        draw: d.draw,

                        start: d.start,

                        length: d.length,

                        search: {

                            value: d.search.value,

                            regex: d.search.regex
                        },

                        order: d.order.map(function (o) {

                            return {

                                column: o.column,

                                dir: o.dir
                            };
                        }),

                        columns: d.columns.map(function (c) {

                            return {

                                data: c.data,

                                name: c.name,

                                searchable: c.searchable,

                                orderable: c.orderable,

                                search: {

                                    value: c.search.value,

                                    regex: c.search.regex
                                }
                            };
                        })
                    };

                    return JSON.stringify(request);
                },

                dataSrc: function (response) {

                    return response.data;
                },

                error: function () {

                    Swal.fire({

                        icon: 'error',

                        title: 'Error',

                        text: 'Unable to load products'
                    });
                }
            },

            columns: [

                {
                    data: 'id'
                },

                {
                    data: 'name'
                },

                {
                    data: 'brand'
                },

                {
                    data: 'price',

                    render: function (data) {

                        return '₹ ' + data;
                    }
                },

                {
                    data: 'inventory',

                    render: function (data) {

                        if (data > 0) {

                            return '<span class="badge bg-success">'
                                    + data +
                                    '</span>';
                        }

                        return '<span class="badge bg-danger">Out Of Stock</span>';
                    }
                },

                {
                    data: 'description',

                    className: 'description-column'
                }

            ]

        });

    });

</script>
</body>
</html>
