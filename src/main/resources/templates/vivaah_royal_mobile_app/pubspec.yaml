name: vivaah_royal
description: >-
  Vivaah Royal — a premium matrimony app. Royal palette inspired by the
  Kartavirya Sahasrarjun painting: deep crimson, royal gold and ivory.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  cached_network_image: ^4.0.4
  cupertino_icons: ^2.0.0
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  google_fonts: ^9.0.0
  intl: ^0.20.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
