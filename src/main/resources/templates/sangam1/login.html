<main id="main-content" class="py-5">
  <div class="container" style="max-width: 460px">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 fw-bold mb-4 text-center" data-i18n="login.title">Member Login</h1>

        <div id="loginErrors" class="alert alert-danger d-none" role="alert">
          <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
          <span id="loginErrorText">Invalid email or password.</span>
        </div>

        <form action="/api/login" method="post">
          <div class="mb-3">
            <label class="form-label" for="loginEmail" data-i18n="reg.email">Email address</label>
            <input type="email" class="form-control" id="loginEmail" name="email" autocomplete="email" required aria-required="true">
          </div>
          <div class="mb-3">
            <label class="form-label" for="loginPass" data-i18n="reg.pass">Password</label>
            <div class="input-group">
              <input type="password" class="form-control" id="loginPass" name="password" autocomplete="current-password" required aria-required="true">
              <button class="btn btn-outline-secondary" type="button" data-toggle-password="loginPass"
                      aria-pressed="false" aria-label="Show password">
                <i class="bi bi-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check mb-0">
              <input class="form-check-input" type="checkbox" id="remember" name="remember">
              <label class="form-check-label" for="remember" data-i18n="login.remember">Remember me</label>
            </div>
            <a href="legal.html" class="small" data-i18n="login.forgot">Forgot password?</a>
          </div>
          <button type="submit" class="btn btn-primary w-100" data-i18n="login.submit">Login</button>
        </form>

        <hr>
        <p class="text-center small mb-0">New to Sangam Matrimony? <a href="register.html" class="fw-semibold">Create a free account</a></p>
      </div>
    </div>
  </div>
</main>
